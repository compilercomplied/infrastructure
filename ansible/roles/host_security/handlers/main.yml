---
- name: Reload SSH
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Restart Fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Collect Fail2ban metrics
  ansible.builtin.systemd_service:
    name: fail2ban-metrics.service
    state: started
