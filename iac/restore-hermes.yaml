apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-restore
  namespace: agent-sidekicks
spec:
  template:
    spec:
      containers:
      - name: restic-restore
        image: alpine:3.19
        command: ["/bin/sh", "-c"]
        args:
          - |
            apk add --no-cache restic
            restic restore latest --target / --tag hermes-agent --tag pvc
        env:
        - name: RESTIC_REPOSITORY
          value: s3:https://1618cf84c34296ebf85368698569a7fa.r2.cloudflarestorage.com/homelab-backup
        - name: RESTIC_PASSWORD
          value: ZIb5jCiDH4M7n3
        - name: AWS_ACCESS_KEY_ID
          value: 18c4815c1f7935947ef26de934ac075e
        - name: AWS_SECRET_ACCESS_KEY
          value: b69d9fc1209ae07c321b67999c85802a9ce56151cf3cf3cf1852ccc4fb678a43
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        volumeMounts:
        - name: data
          mountPath: /opt/data
      restartPolicy: Never
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hermes-agent-pvc
