version: 1
metadata:
  name: cluster-bootstrap
entries:
  # ---------------------------------------------------------------------------
  # Users & Groups
  # ---------------------------------------------------------------------------

  - model: authentik_core.user
    identifiers:
      username: gdario
    attrs:
      name: gdario
      email: !Env AUTHENTIK_USER_GDARIO_EMAIL
      is_active: true

  - model: authentik_core.user
    identifiers:
      username: Andrea
    attrs:
      name: Andrea
      email: !Env AUTHENTIK_USER_ANDREA_EMAIL
      is_active: true

  - model: authentik_core.group
    identifiers:
      name: hermes-users
    attrs:
      users:
        - !Find [authentik_core.user, [username, gdario]]
        - !Find [authentik_core.user, [username, Andrea]]

  - model: authentik_core.group
    identifiers:
      name: grafana-admins
    attrs:
      users:
        - !Find [authentik_core.user, [username, gdario]]

  - model: authentik_core.group
    identifiers:
      name: litellm-admins
    attrs:
      users:
        - !Find [authentik_core.user, [username, gdario]]

  # ---------------------------------------------------------------------------
  # Google OAuth Source
  # ---------------------------------------------------------------------------
  - model: authentik_sources_oauth.oauthsource
    identifiers:
      slug: google
    attrs:
      name: Google
      provider_type: google
      consumer_key: !Env AUTHENTIK_GOOGLE_CLIENT_ID
      consumer_secret: !Env AUTHENTIK_GOOGLE_CLIENT_SECRET
      access_token_url: https://oauth2.googleapis.com/token
      authorization_url: https://accounts.google.com/o/oauth2/v2/auth
      oidc_jwks_url: https://www.googleapis.com/oauth2/v3/certs
      profile_url: https://openidconnect.googleapis.com/v1/userinfo
      authentication_flow: !Find [authentik_flows.flow, [pk, a7c56c41-379d-417c-9885-f0d55e174317]]
      enrollment_flow: !Find [authentik_flows.flow, [pk, 96f96a88-5eec-46fd-9943-ba706bfdc8be]]
      user_matching_mode: email_link

  # Windshift links its bootstrap administrator only when the IdP asserts a verified email.
  - model: authentik_providers_oauth2.scopemapping
    id: windshift-email-scope
    identifiers:
      name: Windshift verified email
    attrs:
      scope_name: email
      expression: |
        return {"email": request.user.email, "email_verified": True}

  # OIDC_APP_REGISTRATIONS
  # ---------------------------------------------------------------------------
  # Syncthing SSO (Forward Proxy)
  # ---------------------------------------------------------------------------
  - model: authentik_providers_proxy.proxyprovider
    id: syncthing-provider
    identifiers:
      name: Syncthing SSO
    attrs:
      external_host: https://syncthing.gdario.dev
      mode: forward_single
      authorization_flow: !Find [authentik_flows.flow, [pk, 9faae557-fad6-4f95-876c-545adc95b3e4]]
      invalidation_flow: !Find [authentik_flows.flow, [pk, 12830a53-f573-488d-bdc2-f12ddc59c0a7]]
      intercept_header_auth: true
      access_token_validity: minutes=10
      refresh_token_validity: days=30

  - model: authentik_core.application
    identifiers:
      slug: syncthing
    attrs:
      name: Syncthing
      provider: !KeyOf syncthing-provider
      meta_launch_url: https://syncthing.gdario.dev
      meta_publisher: GDario Labs

  # Attach the Syncthing proxy provider to the Embedded Outpost
  - model: authentik_outposts.outpost
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      providers:
        - !KeyOf syncthing-provider
