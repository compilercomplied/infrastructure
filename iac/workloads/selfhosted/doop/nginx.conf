server {
    listen 8080;
    listen [::]:8080;
    client_max_body_size 10m;

    # Doop bypasses verification without SMTP; only Authentik may establish a login.
    location ~* ^/api/auth/(sign-up(/|$)|sign-in/email(/|$)|request-password-reset(/|$)|reset-password(/|$)|set-password(/|$)|change-password(/|$)|send-verification-email(/|$)) {
        default_type application/json;
        return 403 '{"message":"Use Sign in with Authentik. Password registration and login are disabled."}';
    }

    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
