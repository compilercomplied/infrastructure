worker_processes 1;
pid /tmp/pulp-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 0;
    proxy_read_timeout 300s;
    server {
        listen 8080;
        server_name pulp.gdario.dev;
        proxy_set_header Host pulp.gdario.dev;
        proxy_set_header X-Forwarded-Proto https;
        # Never accept a caller-supplied trusted identity, including on machine paths.
        proxy_set_header X-Remote-User "";
        proxy_set_header X-Forwarded-User "";
        location = /nginx-healthz { access_log off; return 200 "ok\n"; }
        location = /healthz {
            access_log off;
            proxy_pass http://127.0.0.1:24817/pulp/api/v3/status/;
        }
        location /oauth2/ {
            proxy_pass http://127.0.0.1:4180;
            proxy_set_header X-Auth-Request-Redirect https://pulp.gdario.dev/;
        }
        location = /_identity {
            internal;
            # Basic clients must receive Pulp's response, never an OIDC redirect.
            if ($http_authorization ~* "^Basic ") { return 204; }
            proxy_pass http://127.0.0.1:4180/oauth2/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URL https://pulp.gdario.dev$request_uri;
        }
        location ~ ^/(pulp/api/|pypi/|pulp/maven/) {
            auth_request /_identity;
            auth_request_set $session_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $session_cookie always;
            error_page 401 = @machine_unauthorized;
            auth_request_set $pulp_user $upstream_http_x_auth_request_email;
            proxy_set_header Host pulp.gdario.dev;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Remote-User $pulp_user;
            proxy_set_header X-Forwarded-User "";
            proxy_pass http://127.0.0.1:24817;
        }
        location /pulp/content/ {
            proxy_pass http://127.0.0.1:24816;
        }
        location @machine_unauthorized {
            add_header WWW-Authenticate 'Basic realm="Pulp"' always;
            return 401;
        }
        location @login { return 302 /oauth2/start?rd=https%3A%2F%2Fpulp.gdario.dev%2F; }
        location /static/ {
            auth_request /_identity;
            auth_request_set $session_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $session_cookie always;
            error_page 401 = @login;
            alias /var/lib/operator/static/;
        }
        location / {
            auth_request /_identity;
            auth_request_set $session_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $session_cookie always;
            error_page 401 = @login;
            root /var/lib/operator/static/pulp_ui;
            try_files $uri /index.html;
        }
    }
}
