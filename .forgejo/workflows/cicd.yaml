name: cicd

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ansible-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Ansible
        run: python3 -m pip install --user ansible-core
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Validate Ansible playbooks
        working-directory: ansible
        run: |
          ansible-playbook playbooks/provision_cluster.yml --syntax-check
          ansible-playbook playbooks/provision_pxe.yml --syntax-check
      - name: Test maintenance safety decisions
        run: |
          python3 -B -m unittest discover -s ansible/tests -v
          ansible-playbook -i localhost, ansible/tests/render_maintenance.yml
  cicd:
    needs: ansible-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Pulumi CLI
        run: curl -fsSL https://get.pulumi.com | sh -s -- --version 3.228.0 && echo "$HOME/.pulumi/bin" >> $GITHUB_PATH

      - name: Generate Provider SDKs and Install Dependencies
        run: pulumi install --non-interactive
        working-directory: ./iac

      - name: Validate Infrastructure
        run: npm run check
        working-directory: ./iac

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.HOMELAB_KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Run Pulumi Preview
        if: github.event_name == 'pull_request'
        run: pulumi preview --diff --stack local
        working-directory: ./iac
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: Run Pulumi Up
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: pulumi up --stack local --yes --skip-preview
        working-directory: ./iac
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
